[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-law-tools"
version = "0.2.0"
description = "Dependency-free Python tools for parsing and normalizing Saudi Arabian legal text."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Saudi Law Tools Contributors"}
]
keywords = [
    "saudi-arabia",
    "law",
    "legal-tech",
    "arabic",
    "legal-text",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
]

[project.scripts]
saudi-law-tools = "saudi_law_tools.cli:main"

[project.urls]
Homepage = "https://github.com/brokelawstudent/saudi-law-tools"
Repository = "https://github.com/brokelawstudent/saudi-law-tools"
Issues = "https://github.com/brokelawstudent/saudi-law-tools/issues"
Changelog = "https://github.com/brokelawstudent/saudi-law-tools/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["saudi_law_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

